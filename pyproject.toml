[project]
name = "thameswaterapi"
version = "0.4.0"
description = "A Python client for retrieving hourly meter data from Thames Water"
authors = [
    {name = "Ayrton Bourn", email = "ayrtonbourn@outlook.com"},
]
maintainers = [
    {name = "Jelmer Vernooĳ", email = "jelmer@jelmer.uk"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "requests>=2.31.0",
    # Windows ships no zone database, and readings are timestamped in
    # Europe/London.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
lint = [
    "ruff==0.16.5",
]

[project.urls]
Homepage = "https://github.com/jelmer/thameswaterapi"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.7.0",
]

[tool.setuptools.package-data]
# The tariff table is data beside the module, which setuptools leaves out of
# the wheel unless it is named here. A source checkout imports it either way,
# so an omission only shows up once installed.
thameswaterapi = ["*.csv"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The repository root also holds test modules, which are not part of the
# distribution, so the package is named rather than discovered.
packages = ["thameswaterapi"]
